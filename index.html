<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inmobiliaria - Master Plan en Tiempo Real</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent-gold: #fbbf24;
            --accent-blue: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --status-green: #22c55e;
            --status-yellow: #eab308;
            --status-red: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); line-height: 1.6; }

        header {
            background-color: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 100;
            border-bottom: 1px solid #334155;
            padding: 1rem 2rem;
            display: flex; justify-content: space-between; align-items: center;
        }

        .logo { font-size: 1.5rem; font-weight: bold; color: var(--accent-gold); display: flex; align-items: center; gap: 0.5rem; }
        .container { max-width: 1400px; margin: 0 auto; padding: 2rem; }

        .hero { text-align: center; padding: 3rem 1rem; background: linear-gradient(180deg, rgba(30,41,59,0.5) 0%, rgba(15,23,42,1) 100%); border-radius: 1rem; margin-bottom: 2rem; }
        .hero h1 { font-size: 2.5rem; margin-bottom: 1rem; color: var(--accent-gold); }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .stat-card { background: var(--card-bg); padding: 1.5rem; border-radius: 0.75rem; border: 1px solid #334155; text-align: center; }
        .stat-card .number { font-size: 2rem; font-weight: bold; margin-top: 0.5rem; }
        .stat-card.available .number { color: var(--status-green); }
        .stat-card.reserved .number { color: var(--status-yellow); }
        .stat-card.sold .number { color: var(--status-red); }

        .masterplan-container { background: var(--card-bg); border-radius: 1rem; padding: 2rem; border: 1px solid #334155; margin-bottom: 3rem; }
        .map-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
        .legend { display: flex; gap: 1.5rem; }
        .legend-item { display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; }
        .color-box { width: 16px; height: 16px; border-radius: 4px; }

        .svg-container { width: 100%; background: #0b1120; border-radius: 0.75rem; padding: 1rem; overflow-x: auto; border: 1px solid #1e293b; }
        svg polygon, svg path { cursor: pointer; transition: all 0.2s; stroke: #000; stroke-width: 1.5; }
        svg polygon:hover, svg path:hover { filter: brightness(1.2); stroke: #fff; stroke-width: 2.5; }

        .status-available { fill: #22c55e !important; }
        .status-reserved { fill: #eab308 !important; }
        .status-sold { fill: #ef4444 !important; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: var(--card-bg); padding: 2rem; border-radius: 1rem; width: 90%; max-width: 500px; border: 1px solid #334155; }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: var(--text-muted); }
        .form-group select { width: 100%; padding: 0.75rem; background: var(--bg-dark); border: 1px solid #334155; border-radius: 0.5rem; color: var(--text-main); }
        .btn { background: var(--accent-gold); color: #000; border: none; padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fas fa-mountain-city"></i> INMOBILIARIA - EL RODEO</div>
    </header>

    <div class="container">
        <section class="hero">
            <h1>Master Plan en Tiempo Real</h1>
            <p>Gestión de lotes sincronizada en la nube con Firebase Firestore.</p>
        </section>

        <div class="stats-grid">
            <div class="stat-card"><div>Total Lotes</div><div class="number" id="total-count">0</div></div>
            <div class="stat-card available"><div>Disponibles</div><div class="number" id="available-count">0</div></div>
            <div class="stat-card reserved"><div>Apartados</div><div class="number" id="reserved-count">0</div></div>
            <div class="stat-card sold"><div>Vendidos</div><div class="number" id="sold-count">0</div></div>
        </div>

        <section class="masterplan-container">
            <div class="map-controls">
                <div class="legend">
                    <div class="legend-item"><div class="color-box" style="background:#22c55e"></div> Disponible</div>
                    <div class="legend-item"><div class="color-box" style="background:#eab308"></div> Apartado</div>
                    <div class="legend-item"><div class="color-box" style="background:#ef4444"></div> Comprado</div>
                </div>
                <span style="color: var(--text-muted); font-size: 0.9rem;">Haz clic en cualquier lote para actualizar su estado</span>
            </div>

            <div class="svg-container">
                <svg viewBox="0 0 900 850" width="100%" height="650">
                    <g transform="rotate(-12, 450, 420)">
                        <path d="M 680 180 L 780 320 L 520 780" fill="none" stroke="#64748b" stroke-width="25"/>
                        <path d="M 230 270 L 650 355" stroke="#475569" stroke-width="20"/>
                        <path d="M 200 480 L 620 565" stroke="#475569" stroke-width="20"/>

                        <!-- MANZANA SUPERIOR -->
                        <polygon id="N-12" points="230,120 255,125 240,250 215,245" class="lote status-available" data-id="N-12"/>
                        <polygon id="N-11" points="255,125 280,130 265,255 240,250" class="lote status-available" data-id="N-11"/>
                        <polygon id="N-10" points="280,130 305,135 290,260 265,255" class="lote status-available" data-id="N-10"/>
                        <polygon id="N-9"  points="305,135 330,140 315,265 290,260" class="lote status-available" data-id="N-9"/>

                        <!-- MANZANA CENTRO -->
                        <polygon id="C-12" points="220,285 245,290 232,380 207,375" class="lote status-available" data-id="C-12"/>
                        <polygon id="C-11" points="245,290 270,295 257,385 232,380" class="lote status-available" data-id="C-11"/>
                        <polygon id="C-10" points="270,295 295,300 282,390 257,385" class="lote status-available" data-id="C-10"/>
                    </g>
                </svg>
            </div>
        </section>
    </div>

    <!-- MODAL DE EDICIÓN -->
    <div id="loteModal" class="modal">
        <div class="modal-content">
            <h3 id="modalLoteTitle">Gestión del Lote</h3>
            <div class="form-group" style="margin-top: 1rem;">
                <label>Cambiar Estatus:</label>
                <select id="statusSelect">
                    <option value="status-available">Verde - Disponible</option>
                    <option value="status-reserved">Amarillo - Apartado</option>
                    <option value="status-sold">Rojo - Comprado</option>
                </select>
            </div>
            <div style="display:flex; gap:1rem; justify-content:flex-end;">
                <button class="btn" onclick="closeModal()" style="background:#475569; color:#fff;">Cancelar</button>
                <button class="btn" onclick="saveToFirebase()">Guardar en Firebase</button>
            </div>
        </div>
    </div>

    <!-- MÓDULOS SDK DE FIREBASE CON TUS CREDENCIALES -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Tus credenciales configuradas
        const firebaseConfig = {
            apiKey: "AIzaSyDYCIOitjuYMJ4FkH5Nr20T_7UWauAWFP0",
            authDomain: "inmobiliaria-lotes.firebaseapp.com",
            projectId: "inmobiliaria-lotes",
            storageBucket: "inmobiliaria-lotes.firebasestorage.app",
            messagingSenderId: "1098045851833",
            appId: "1:1098045851833:web:cb31ea99d26ca92366f368"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let selectedLoteId = null;

        // Escuchar cambios en tiempo real desde Firestore
        document.querySelectorAll('.lote').forEach(lote => {
            const loteId = lote.getAttribute('data-id');
            
            // Sincronizar estado en tiempo real
            onSnapshot(doc(db, "lotes", loteId), (snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.data();
                    lote.setAttribute('class', `lote ${data.status}`);
                    updateCounters();
                }
            });

            // Abrir modal al hacer clic
            lote.addEventListener('click', () => {
                selectedLoteId = loteId;
                document.getElementById('modalLoteTitle').innerText = `Gestión Lote #${loteId}`;
                document.getElementById('loteModal').style.display = 'flex';
            });
        });

        // Guardar el cambio en Firebase Firestore
        window.saveToFirebase = async function() {
            if (selectedLoteId) {
                const newStatus = document.getElementById('statusSelect').value;
                await setDoc(doc(db, "lotes", selectedLoteId), {
                    status: newStatus,
                    updatedAt: new Date()
                }, { merge: true });

                closeModal();
            }
        };

        window.closeModal = function() {
            document.getElementById('loteModal').style.display = 'none';
        };

        function updateCounters() {
            const total = document.querySelectorAll('.lote').length;
            const available = document.querySelectorAll('.lote.status-available').length;
            const reserved = document.querySelectorAll('.lote.status-reserved').length;
            const sold = document.querySelectorAll('.lote.status-sold').length;

            document.getElementById('total-count').innerText = total;
            document.getElementById('available-count').innerText = available;
            document.getElementById('reserved-count').innerText = reserved;
            document.getElementById('sold-count').innerText = sold;
        }
    </script>
</body>
</html>
